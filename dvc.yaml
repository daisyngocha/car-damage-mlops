stages:
  validate:
    cmd: PYTHONPATH=. python src/validate.py
    deps:
      - src/validate.py
      - data/raw
    params:
      - conf/data/default.yaml:
          - validation
    outs:
      - reports/validation.json:
          cache: false

  prepare:
    cmd: PYTHONPATH=. python src/prepare.py
    deps:
      - src/prepare.py
      - data/raw
      - reports/validation.json
    params:
      - conf/data/default.yaml:
          - resize
    outs:
      - data/processed

  train:
    cmd: PYTHONPATH=. python src/train.py
    deps:
      - src/train.py
      - data/processed
      - src/tracking.py
    params:
      - conf/config.yaml:
          - seed
      - conf/train/default.yaml:
      - conf/model/resnet18.yaml:
    outs:
      - models/model.pt
      - reports/train_history.csv:
          cache: false
      - reports/train_summary.json:
          cache: false

  evaluate:
    cmd: PYTHONPATH=. python src/evaluate.py
    deps:
      - src/evaluate.py
      - models/model.pt
      - data/processed
    params:
      - conf/train/default.yaml:
          - batch_size
    metrics:
      - reports/metrics.json:
          cache: false
    plots:
      - reports/confusion.csv:
          cache: false
          template: confusion
          x: actual
          y: predicted
