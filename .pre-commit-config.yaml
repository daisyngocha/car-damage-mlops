# Giữ nguyên code upstream đến G4 để còn diff với pytorch/examples
default_install_hook_types: [pre-commit, pre-push]   # đặt ở đầu file
repos:
  - repo: local
    hooks:
      - id: dvc-push
        name: dvc push
        entry: uv run dvc push
        language: system
        stages: [pre-push]
        pass_filenames: false
        always_run: true
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1000]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main]
      - id: check-merge-conflict
      - id: check-yaml
      - id: end-of-file-fixer
        exclude: ^(dvc\.lock|reports/)
      - id: trailing-whitespace
        exclude: ^(dvc\.lock|reports/)
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.12.23
    hooks:
      - id: uv-lock
